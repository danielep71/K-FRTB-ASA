version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v0.3.0
    schedule:
      interval: weekly
    # A version is proposed only 14 days after its release; security
    # updates are separate and not delayed.
    cooldown:
      default-days: 14
    assignees: [danielep71]
    labels: [repository, ci, P3]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /.github
    target-branch: release/v0.3.0
    schedule:
      interval: weekly
    # A version is proposed only 14 days after its release; security
    # updates are separate and not delayed.
    cooldown:
      default-days: 14
    assignees: [danielep71]
    labels: [repository, ci, P3]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tests
    target-branch: release/v0.3.0
    schedule:
      interval: weekly
    # A version is proposed only 14 days after its release; security
    # updates are separate and not delayed.
    cooldown:
      default-days: 14
    assignees: [danielep71]
    labels: [repository, tests, P3]
    open-pull-requests-limit: 5
