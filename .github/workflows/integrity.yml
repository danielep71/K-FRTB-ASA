name: Repository integrity

# No path filters: documentation-only PRs must produce the same required check.
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer head of the same PR cancels the older run; a push run is never
# cancelled, so each pushed commit keeps its result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('integrity-pr-{0}', github.event.pull_request.number) || format('integrity-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exact runtimes, so a runner image update cannot change them; Dependabot
      # updates the actions, and the versions are changed here by hand.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
      # The parser, the quality tools, and the test packages mypy type-checks against.
      - name: Install the hashed parser, quality tools and test packages
        run: |
          python --version
          node --version
          git --version
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/requirements.txt -r .github/requirements-quality.txt -r tests/requirements.txt
      # actionlint is a Go binary: a pinned release, verified by SHA-256 before use.
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "ACTIONLINT=$RUNNER_TEMP/actionlint/actionlint" >> "$GITHUB_ENV"
      # On a PR, GITHUB_SHA is the merge commit GitHub tests; the report also
      # names the PR head, and the report and artifact are named after it.
      - name: Validate repository, run the quality gates and offline maintenance fixtures
        env:
          REPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRE_QUALITY_TOOLS: "1"
        run: .venv-ci/bin/python tools/check_repository.py --report "integrity-report/integrity-${REPORT_HEAD_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      # Uploaded whatever the result; a missing report fails the job.
      - name: Upload the integrity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrity-report-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: integrity-report/
          if-no-files-found: error
          retention-days: 30
