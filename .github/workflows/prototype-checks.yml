name: Prototype checks
run-name: Prototype checks — ${{ github.ref_name }} @ ${{ github.sha }}

# Static lint of the VBA modules, then the whole pytest suite: hand-calculated
# reference tests, reconciliation of the VBA engine executed headless in
# LibreOffice with the independent Python reference, the template and runtime
# contract tests, and offline tests of the tools (sync script, export
# comparison, evidence validator, repository maintenance). Excel itself is
# not available on hosted runners, so Excel compilation and runtime remain
# manual evidence (docs/EXCEL_EVIDENCE.md).

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - src/**
      - tests/**
      - tools/**
      - .github/workflows/prototype-checks.yml
      - .github/requirements.txt
      - .github/requirements.in
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: VBA lint, reference tests and LibreOffice reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A hung package mirror fails here instead of using the whole job limit.
      # The runner's Azure package mirror sometimes stops answering, and apt
      # then waits on every package (#263): the first attempt has short apt
      # timeouts and its own limit; if it fails, the step installs again from
      # archive.ubuntu.com. The step limit still bounds both (#124).
      - name: Install LibreOffice Calc and the Python UNO bridge
        timeout-minutes: 12
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15)
          packages=(libreoffice-calc python3-uno)
          if ! { sudo timeout 120 apt-get "${apt_options[@]}" update &&
                 sudo timeout 300 apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"; }; then
            echo "::warning::The runner's package mirror did not answer; installing from archive.ubuntu.com"
            for list in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$list" ]; then
                sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$list"
              fi
            done
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
          fi

      # The OS Python, because python3-uno is built for it. --ignore-installed
      # installs every package from its hashed wheel even when the OS has one.
      - name: Install hashed Python test dependencies
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --ignore-installed -r tests/requirements.txt -r .github/requirements.txt

      - name: Static lint of the VBA modules
        run: .venv/bin/python tools/vba_lint.py

      - name: Reference, reconciliation and tooling tests
        env:
          REQUIRE_LIBREOFFICE: "1"
        run: .venv/bin/python -m pytest -v tests
