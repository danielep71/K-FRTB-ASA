name: Excel check
run-name: Excel check (${{ inputs.profile || 'quick' }}) — ${{ github.ref_name }} @ ${{ github.sha }}

# Runs the unattended Excel check (tools/Check-FRTB-Excel.ps1) on my own
# Windows host, through a self-hosted runner with the labels self-hosted,
# windows and excel. A push to main or a release branch runs the quick profile;
# a manual run can ask for the full profile. The runner executes the code of
# the commit, so the workflow never runs for a pull request, and only for my
# pushes. It uploads no artifact: the bundle stays on the host, because it
# records the computer name and local paths, and the checkout keeps it between
# runs (clean: false). See docs/EXCEL_EVIDENCE.md.
on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      profile:
        description: "quick (a few minutes) or full (about ten, and the one to record)"
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

# One Excel at a time: a second run waits for the first
concurrency:
  group: excel-check
  cancel-in-progress: false

jobs:
  excel:
    name: Excel check (${{ inputs.profile || 'quick' }})
    if: github.repository == 'danielep71/K-FRTB-ASA' && github.actor == github.repository_owner
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 45
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: false  # keep test-results, the only copy of the bundles

      # A cmd step, because the host's PowerShell execution policy refuses the temporary
      # script the runner writes for a PowerShell step; the script below is started with
      # -ExecutionPolicy Bypass and reads the branch from the environment.
      - name: Run the check
        shell: cmd
        env:
          PROFILE: ${{ inputs.profile || 'quick' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Run-Excel-Check-CI.ps1
          exit /b %ERRORLEVEL%
